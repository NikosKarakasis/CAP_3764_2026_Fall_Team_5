# Conda environment for CAP 3764 Team 5 – Seoul Bike Sharing Demand
# Versions match the environment the notebooks were run with.
# Create:   conda env create -f bike_dataset_packages_cap3764-seoul-bike.yml
# Activate: conda activate bike_dataset_packages_cap3764-seoul-bike
# Update:   conda env update -f bike_dataset_packages_cap3764-seoul-bike.yml --prune
name: bike_dataset_packages_cap3764-seoul-bike
channels:
  - conda-forge
dependencies:
  - python=3.14.7
  # Data handling
  - pandas=3.0.5
  - numpy=2.5.2
  # Visualization
  - matplotlib=3.11.1
  - seaborn=0.13.2
  - plotly=7.1.0
  # Modeling and interpretation
  - scikit-learn=1.9.1
  - xgboost=3.4.1
  - shap=0.54.1
  # Notebooks
  - jupyterlab=4.6.2
  - ipykernel=7.3.0
