# Conda environment for CAP 3764 Team 5 – Seoul Bike Sharing Demand
# Create:   conda env create -f environment.yml
# Activate: conda activate cap3764-team5
# Update:   conda env update -f environment.yml --prune
name: cap3764-team5
channels:
  - conda-forge
dependencies:
  - python=3.14
  # Data handling
  - pandas>=3.0
  - numpy
  # Visualization
  - matplotlib
  - seaborn
  - plotly
  # Modeling and interpretation
  - scikit-learn=1.9.1
  - xgboost=3.4.1
  - shap=0.54.1
  # Notebooks
  - jupyterlab
  - ipykernel
